name: Client Go Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client-go/go.mod
          cache-dependency-path: client-go/go.sum

      - name: Check install script
        run: sh -n scripts/install-client-go.sh

      - name: Test
        working-directory: client-go
        run: go test ./...

      - name: Build packages
        working-directory: client-go
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="$(git rev-parse --short HEAD)"
          fi

          mkdir -p ../dist
          while read -r target goos goarch goarm gomips gomips64; do
            export CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch"
            unset GOARM GOMIPS GOMIPS64
            if [[ "$goarm" != "-" ]]; then export GOARM="$goarm"; fi
            if [[ "$gomips" != "-" ]]; then export GOMIPS="$gomips"; fi
            if [[ "$gomips64" != "-" ]]; then export GOMIPS64="$gomips64"; fi

            out="../dist/$target"
            mkdir -p "$out"
            go build -trimpath -ldflags="-s -w -X main.version=${version}" -o "$out/nodestatus-client" .
            tar -C "$out" -czf "../dist/nodestatus-client-${target}.tar.gz" nodestatus-client
            rm -rf "$out"
          done <<'TARGETS'
          linux-amd64 linux amd64 - - -
          linux-386 linux 386 - - -
          linux-arm64 linux arm64 - - -
          linux-armv7 linux arm 7 - -
          linux-armv6 linux arm 6 - -
          linux-armv5 linux arm 5 - -
          openwrt-mips linux mips - softfloat -
          openwrt-mipsle linux mipsle - softfloat -
          openwrt-mips64 linux mips64 - - softfloat
          openwrt-mips64le linux mips64le - - softfloat
          TARGETS

      - uses: actions/upload-artifact@v4
        with:
          name: client-go
          path: dist/*.tar.gz

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "client-go $tag"
          gh release upload "$tag" dist/*.tar.gz --clobber
