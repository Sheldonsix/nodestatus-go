name: Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          ghcr_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          dockerhub_image="${DOCKERHUB_USERNAME}/nodestatus-go"

          tags=(--tag "$ghcr_image:staging" --tag "$dockerhub_image:staging")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags=(
              --tag "$ghcr_image:${GITHUB_REF_NAME}"
              --tag "$ghcr_image:latest"
              --tag "$dockerhub_image:${GITHUB_REF_NAME}"
              --tag "$dockerhub_image:latest"
            )
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --file Dockerfile \
            "${tags[@]}" \
            .
