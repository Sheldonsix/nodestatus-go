name: Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:staging")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags=(--tag "$image:${GITHUB_REF_NAME}" --tag "$image:latest")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --file Dockerfile \
            "${tags[@]}" \
            .
